<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ბიოვეტი - Vet AI Assistant</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.chat-container{
    width:1000px;
    height:750px;
    background:white;
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.3);
    display:flex;
    flex-direction:column;
}

.chat-header{
    background: linear-gradient(135deg, #2E8B57 0%, #1a5e3a 100%);
    color:white;
    padding:20px 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:3px solid #ffd700;
}

.chat-header-left {
    display:flex;
    align-items:center;
    gap:15px;
}

.chat-header-left h1 {
    font-size:24px;
    font-weight:bold;
}

.chat-header-left .logo {
    font-size:32px;
}

.badge {
    background: #ffd700;
    color: #1a5e3a;
    font-size:12px;
    padding:4px 14px;
    border-radius:20px;
    font-weight:bold;
    letter-spacing:0.5px;
}

.status {
    display:flex;
    align-items:center;
    gap:8px;
    font-size:14px;
    color: #a8e6cf;
}

.status-dot {
    width:10px;
    height:10px;
    background:#4ade80;
    border-radius:50%;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { opacity:1; }
    50% { opacity:0.3; }
    100% { opacity:1; }
}

.chat-messages{
    flex:1;
    padding:25px;
    overflow-y:auto;
    background: #f0f2f5;
}

.chat-messages::-webkit-scrollbar {
    width:6px;
}

.chat-messages::-webkit-scrollbar-track {
    background: #f0f2f5;
}

.chat-messages::-webkit-scrollbar-thumb {
    background: #2E8B57;
    border-radius:10px;
}

.message{
    max-width:80%;
    padding:14px 20px;
    border-radius:18px;
    margin-bottom:15px;
    word-wrap:break-word;
    animation: slideIn 0.4s ease;
    line-height:1.6;
}

@keyframes slideIn {
    from { 
        opacity: 0; 
        transform: translateY(15px) scale(0.95);
    }
    to { 
        opacity: 1; 
        transform: translateY(0) scale(1);
    }
}

.user{
    background: linear-gradient(135deg, #2E8B57 0%, #3ca86b 100%);
    color:white;
    margin-left:auto;
    border-bottom-right-radius: 5px;
    box-shadow: 0 2px 8px rgba(46, 139, 87, 0.3);
}

.bot{
    background: white;
    color:#222;
    border-bottom-left-radius: 5px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    border:1px solid #e8ecf0;
}

.bot .product-tag {
    display: inline-block;
    background: #2E8B57;
    color: white;
    padding: 3px 12px;
    border-radius:15px;
    font-size:11px;
    margin-top:8px;
    font-weight:bold;
}

.typing-indicator {
    display: none;
    padding:14px 20px;
    background: white;
    border-radius:18px;
    max-width:80%;
    margin-bottom:15px;
    border:1px solid #e8ecf0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.typing-indicator span {
    display: inline-block;
    width:10px;
    height:10px;
    background: #2E8B57;
    border-radius:50%;
    margin:0 3px;
    animation: typing 1.4s infinite both;
}

.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing {
    0%, 80%, 100% { transform: scale(0.5); opacity:0.4; }
    40% { transform: scale(1); opacity:1; }
}

.chat-input{
    display:flex;
    padding:18px 25px;
    border-top:2px solid #e8ecf0;
    background: white;
    gap:12px;
    align-items:center;
}

.chat-input input{
    flex:1;
    padding:14px 20px;
    border:2px solid #e0e4e8;
    border-radius:25px;
    outline:none;
    font-size:16px;
    transition: all 0.3s;
    background: #f8f9fa;
}

.chat-input input:focus {
    border-color: #2E8B57;
    background: white;
    box-shadow: 0 0 0 4px rgba(46, 139, 87, 0.1);
}

.chat-input input:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.chat-input button{
    padding:14px 30px;
    border:none;
    border-radius:25px;
    background: linear-gradient(135deg, #2E8B57 0%, #3ca86b 100%);
    color:white;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    transition: all 0.3s;
    box-shadow: 0 4px 12px rgba(46, 139, 87, 0.3);
    white-space:nowrap;
}

.chat-input button:hover{
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(46, 139, 87, 0.4);
}

.chat-input button:active {
    transform: translateY(0px);
}

.chat-input button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

.quick-actions {
    display:flex;
    gap:8px;
    padding:10px 25px;
    background: #f8f9fa;
    border-top:1px solid #e8ecf0;
    flex-wrap:wrap;
}

.quick-btn {
    padding:6px 14px;
    border:1px solid #d0d5dc;
    border-radius:20px;
    background: white;
    color: #555;
    font-size:12px;
    cursor:pointer;
    transition: all 0.3s;
}

.quick-btn:hover {
    border-color: #2E8B57;
    background: #f0f7f4;
    color: #2E8B57;
}

@media (max-width: 768px) {
    .chat-container {
        height:100vh;
        width:100%;
        border-radius:0;
    }
    
    .message {
        max-width:90%;
    }
    
    .chat-header-left h1 {
        font-size:18px;
    }
    
    .badge {
        font-size:10px;
        padding:2px 10px;
    }
}
</style>
</head>
<body>

<div class="chat-container">

    <div class="chat-header">
        <div class="chat-header-left">
            <span class="logo">🐾</span>
            <h1>ბიოვეტი</h1>
            <span class="badge">AI ასისტენტი</span>
        </div>
        <div class="status">
            <span class="status-dot"></span>
            <span>ონლაინ</span>
        </div>
    </div>

    <div class="chat-messages" id="chat">
        <div class="message bot">
            <strong>გამარჯობა! 👋</strong><br><br>
            მე ვარ <strong>ბიოვეტის</strong> ვირტუალური ასისტენტი.<br>
            აღწერეთ თქვენი შინაური ცხოველის სიმპტომები და შევეცდები დაგეხმაროთ.<br><br>
            <span style="font-size:13px; color:#888;">🐶 მაგ: "ჩემს ძაღლს აქვს დიარეა"</span>
        </div>
    </div>

    <div class="typing-indicator" id="typing">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="quick-actions">
        <button class="quick-btn" onclick="quickMessage('ძაღლს აქვს დიარეა')">💩 დიარეა</button>
        <button class="quick-btn" onclick="quickMessage('კატას აქვს ჭიები')">🐛 ჭიები</button>
        <button class="quick-btn" onclick="quickMessage('ძაღლს ტკივილი აქვს')">😢 ტკივილი</button>
        <button class="quick-btn" onclick="quickMessage('რწყილები მაქვს')">🦟 რწყილები</button>
        <button class="quick-btn" onclick="quickMessage('ყური მიწითლდება')">👂 ყური</button>
    </div>

    <div class="chat-input">
        <input
            type="text"
            id="message"
            placeholder="დაწერეთ თქვენი შეკითხვა..."
            onkeypress="if(event.key==='Enter') sendMessage()"
            autofocus
        >
        <button id="sendBtn" onclick="sendMessage()">
            📤 გაგზავნა
        </button>
    </div>

</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("message");
const sendBtn = document.getElementById("sendBtn");
const typingIndicator = document.getElementById("typing");
let isProcessing = false;

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = `message ${type}`;
    
    if (type === "bot") {
        div.innerHTML = text.replace(/\n/g, "<br>");
    } else {
        div.textContent = text;
    }
    
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
    typingIndicator.style.display = "block";
    chat.scrollTop = chat.scrollHeight;
}

function hideTyping() {
    typingIndicator.style.display = "none";
}

function quickMessage(text) {
    if (isProcessing) return;
    input.value = text;
    sendMessage();
}

async function sendMessage() {
    if (isProcessing) return;
    
    const message = input.value.trim();
    if (!message) return;

    isProcessing = true;
    input.disabled = true;
    sendBtn.disabled = true;

    addMessage(message, "user");
    input.value = "";
    showTyping();

    try {
        const response = await fetch("/ai-chat/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": getCookie("csrftoken")
            },
            body: JSON.stringify({ message: message })
        });

        const data = await response.json();
        hideTyping();

        // ✅ FIX: Check both response and reply
        const reply = data.response || data.reply || "ბოდიში, ვერ გავიგე თქვენი შეკითხვა. 🐾";
        addMessage(reply, "bot");

        // Show available products if any
        if (data.products && data.products.length > 0) {
            const productDiv = document.createElement("div");
            productDiv.className = "message bot";
            productDiv.style.fontSize = "13px";
            productDiv.style.opacity = "0.9";
            productDiv.style.background = "#f8f9fa";
            productDiv.style.border = "1px dashed #2E8B57";
            
            const productList = data.products.map(p => 
                `• <strong>${p.name}</strong> - ${p.use}`
            ).join("<br>");
            
            productDiv.innerHTML = `📦 <strong>ჩვენს მაღაზიაში გაქვთ:</strong><br>${productList}`;
            chat.appendChild(productDiv);
        }

    } catch(error) {
        hideTyping();
        addMessage("🔌 ინტერნეტთან კავშირის შეცდომა. გთხოვთ, სცადეთ თავიდან.", "bot");
        console.error("Error:", error);
    }

    isProcessing = false;
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
}

// CSRF Token helper
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// Auto-focus on load
window.onload = function() {
    input.focus();
};

// Handle Enter key with shift for new lines
input.addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});
</script>

</body>
</html>
